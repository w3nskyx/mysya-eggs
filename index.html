<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Как Муся яйца ловила</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
    background: #dff3ff;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(
                to bottom,
                #87ceeb 0%,
                #dff6ff 70%,
                #9be28f 70%,
                #72c96a 100%
            );
        }

        .title {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #333;
        }

        .score {
            position: absolute;
            top: 65px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .player {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 70px;
        }

        .basket {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 70px;
            transition: left 0.1s ease;
        }

                    .egg {
            position: absolute;
            font-size: 42px;
            top: 0;
            left: 0;
            transform: translate(-50%, 0);
            pointer-events: none;
            will-change: top, left;
        }

        .egg.golden {
            filter: drop-shadow(0 0 8px gold) drop-shadow(0 0 16px orange);
            animation: goldenPulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes goldenPulse {
            from { transform: translate(-50%, 0) scale(1); }
            to   { transform: translate(-50%, 0) scale(1.15); }
        }

        

        .signature {
            position: absolute;
            bottom: 65px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: rgba(0,0,0,0.45);
            pointer-events: none;
        }

        button {
            border: none;
    border-radius: 18px;
    padding: 18px 28px;
    font-size: 24px;
    background: white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    min-width: 80px;
}


        button:active {
            transform: scale(0.95);
        }
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.25);
            z-index: 20;
            max-width: 85vw;
        }

        #startScreen h2 {
            margin-top: 0;
            font-size: 24px;
            color: #333;
        }

        #startScreen p {
            font-size: 16px;
            color: #555;
            margin: 15px 0 25px;
            line-height: 1.4;
        }

        #startScreen button {
            font-size: 22px;
            padding: 18px 32px;
            background: #4caf50;
            color: white;
            font-weight: bold;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

               #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.25);
            z-index: 30;
            pointer-events: auto;
            touch-action: manipulation;
        }

        #gameOver h2 {
            margin-top: 0;
            font-size: 24px;
        }

        #gameOver p {
            font-size: 20px;
        }
    </style>
</head>
    
<body>
   <div id="startScreen">
        <h2>🥚 Как Муся яйца ловила</h2>
        <p>Води пальцем по экрану —<br>корзина едет за пальцем.<br><br>Поймай как можно больше яиц!</p>
        <button id="startBtn">🎮 Начать игру</button>
    </div>
<div id="game">

    <div class="title">
        🥚 Как Муся яйца ловила
    </div>

    <div class="score">
        Поймано: <span id="score">0</span>
        <br>
        Жизни: <span id="lives">❤️❤️❤️</span>
    </div>

    <div class="player">
        🧑🏻
    </div>

    

    <div class="basket" id="basket">
        🧺
    </div>

    <div class="signature">
        Сделано с ❤️ Матусевичем
    </div>

    
    

    <div id="gameOver">
        <h2>💔 Муся не справилась с яйцами</h2>

        <p>
            Поймано яиц:
            <strong><span id="finalScore">0</span></strong>
        </p>

                <button id="restartBtn">🔄 Попробовать снова</button>
        
    </div>

</div>

<script>
            if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    // ───── Состояние игры ─────
    let basketPosition = 50;
    let score = 0;
    let lives = 3;
    let gameActive = true;
    let gameStarted = false;
    let eggSpeedBase = 5;         // базовая скорость падения яиц
    let activeEggs = [];          // все летящие сейчас яйца
    let spawnTimer = null;        // таймер спавна
    let gameLoopTimer = null;     // общий игровой таймер (60fps)
    let lastSpawnTime = 0;        // когда последний раз спавнили
    let lastFrameTime = 0;        // для расчёта delta в игровом цикле

    // ───── Настройки сложности ─────
    let currentSpawnInterval = 1400;  // мс между спавнами (уменьшается со временем)
    let currentEggsPerSpawn = 1;      // сколько яиц за раз (растёт)
    let currentEggSpeed = 5;          // скорость падения (растёт)

    // ───── Ссылки на DOM ─────
    const basket = document.getElementById("basket");
    const scoreText = document.getElementById("score");
    const livesText = document.getElementById("lives");
    const gameOver = document.getElementById("gameOver");
    const finalScore = document.getElementById("finalScore");
    const gameEl = document.getElementById("game");

    // ───── Вибрация ─────
    function vibrate(type) {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            try {
                if (type === "short") window.Telegram.WebApp.HapticFeedback.impactOccurred("light");
                else if (type === "medium") window.Telegram.WebApp.HapticFeedback.impactOccurred("medium");
                else if (type === "long") window.Telegram.WebApp.HapticFeedback.notificationOccurred("error");
                return;
            } catch (e) {}
        }
        if (navigator.vibrate) {
            if (type === "short") navigator.vibrate(30);
            else if (type === "medium") navigator.vibrate(80);
            else if (type === "long") navigator.vibrate([100, 50, 100, 50, 200]);
        }
    }

    // ───── Корзина ─────
    function updateBasket() {
        basket.style.left = basketPosition + "%";
    }

    function moveBasketTo(clientX) {
        if (!gameActive) return;
        const rect = gameEl.getBoundingClientRect();
        let percent = ((clientX - rect.left) / rect.width) * 100;
        percent = Math.max(8, Math.min(92, percent));
        basketPosition = percent;
        updateBasket();
    }

    // Мышь (комп)
    gameEl.addEventListener("mousedown", (e) => {
        moveBasketTo(e.clientX);
        const onMove = (ev) => moveBasketTo(ev.clientX);
        const onUp = () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
        };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
    });

    // Палец (телефон)
    gameEl.addEventListener("touchstart", (e) => {
        e.preventDefault();
        moveBasketTo(e.touches[0].clientX);
    }, { passive: false });

    gameEl.addEventListener("touchmove", (e) => {
        e.preventDefault();
        moveBasketTo(e.touches[0].clientX);
    }, { passive: false });

    // ───── Жизни ─────
    function updateLives() {
        livesText.textContent = "❤️".repeat(lives);
    }

    // ───── Спавн яйца ─────
    function spawnEgg() {
        if (!gameActive || !gameStarted) return;

        const eggX = Math.random() * 84 + 8;        // 8..92 %
        const isGolden = Math.random() < 0.15;

        // Создаём DOM-элемент
        const eggEl = document.createElement("div");
        eggEl.className = "egg" + (isGolden ? " golden" : "");
        eggEl.textContent = "🥚";
        eggEl.style.left = eggX + "%";
        eggEl.style.top = "190px";
        gameEl.appendChild(eggEl);

        // Объект яйца
        const eggObj = {
            el: eggEl,
            x: eggX,
            y: 190,
            speed: currentEggSpeed,
            isGolden: isGolden,
            alive: true
        };

        activeEggs.push(eggObj);
    }

    // ───── Проверка попадания ─────
    function checkCatch(egg) {
        return Math.abs(egg.x - basketPosition) < 12;
    }

    // ───── Обработка долетевшего яйца ─────
    function handleEggLanded(egg) {
        const caught = checkCatch(egg);

        if (caught) {
            score += egg.isGolden ? 5 : 1;
            scoreText.textContent = score;
            if (egg.isGolden) vibrate("short");
        } else {
            lives--;
            updateLives();
            vibrate("medium");

            if (lives <= 0) {
                endGame();
                return;
            }
        }

        // Удаляем яйцо
        egg.alive = false;
        if (egg.el.parentNode) egg.el.parentNode.removeChild(egg.el);
    }

    // ───── Игровой цикл (60fps) ─────
    function gameLoop(now) {
        if (!gameActive || !gameStarted) {
            gameLoopTimer = null;
            return;
        }

        if (!lastFrameTime) lastFrameTime = now;
        const delta = (now - lastFrameTime) / 16.67;  // 1 = один кадр при 60fps
        lastFrameTime = now;

        const targetY = window.innerHeight - 150;

        // Двигаем все яйца
        for (let i = activeEggs.length - 1; i >= 0; i--) {
            const egg = activeEggs[i];
            if (!egg.alive) {
                activeEggs.splice(i, 1);
                continue;
            }

            egg.y += egg.speed * delta;
            egg.el.style.top = egg.y + "px";

            if (egg.y >= targetY) {
                handleEggLanded(egg);
                activeEggs.splice(i, 1);
            }
        }

        // Спавн новых яиц
        if (now - lastSpawnTime >= currentSpawnInterval) {
            lastSpawnTime = now;
            for (let i = 0; i < currentEggsPerSpawn; i++) {
                setTimeout(spawnEgg, i * 150);  // разносим по времени чуть-чуть
            }
        }

        gameLoopTimer = requestAnimationFrame(gameLoop);
    }

    // ───── Сложность ─────
    function updateDifficulty() {
        // Каждые 3 очка — ускоряем
        if (score >= 30) {
            currentEggSpeed = 11;
            currentSpawnInterval = 700;
            currentEggsPerSpawn = 3;
        } else if (score >= 20) {
            currentEggSpeed = 9;
            currentSpawnInterval = 900;
            currentEggsPerSpawn = 2;
        } else if (score >= 10) {
            currentEggSpeed = 7;
            currentSpawnInterval = 1100;
            currentEggsPerSpawn = 2;
        } else if (score >= 5) {
            currentEggSpeed = 6;
            currentSpawnInterval = 1200;
            currentEggsPerSpawn = 1;
        } else {
            currentEggSpeed = 5;
            currentSpawnInterval = 1400;
            currentEggsPerSpawn = 1;
        }
    }

    // ───── Управление игрой ─────
    function startGame() {
        gameStarted = true;
        const startScreen = document.getElementById("startScreen");
        if (startScreen) {
            startScreen.style.display = "none";
            startScreen.style.visibility = "hidden";
            startScreen.style.pointerEvents = "none";
        }
        lastSpawnTime = performance.now();
        lastFrameTime = performance.now();
        gameLoopTimer = requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameActive = false;
        gameStarted = false;
        finalScore.textContent = score;
        gameOver.style.display = "block";
        vibrate("long");

        if (gameLoopTimer) {
            cancelAnimationFrame(gameLoopTimer);
            gameLoopTimer = null;
        }
    }

    function restartGame() {
        // Чистим старые яйца
        activeEggs.forEach(e => {
            if (e.el.parentNode) e.el.parentNode.removeChild(e.el);
        });
        activeEggs = [];

        score = 0;
        lives = 3;
        gameActive = true;
        gameStarted = true;
        basketPosition = 50;
        currentEggSpeed = 5;
        currentSpawnInterval = 1400;
        currentEggsPerSpawn = 1;

        scoreText.textContent = score;
        updateLives();
        updateBasket();
        gameOver.style.display = "none";

        lastSpawnTime = performance.now();
        lastFrameTime = performance.now();
        gameLoopTimer = requestAnimationFrame(gameLoop);
    }

    // ───── Кнопки ─────
    const startBtn = document.getElementById("startBtn");
    if (startBtn) {
        startBtn.addEventListener("click", startGame);
        startBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            startGame();
        }, { passive: false });
    }

    document.getElementById("restartBtn").addEventListener("click", restartGame);
    document.getElementById("restartBtn").addEventListener("touchstart", (e) => {
        e.preventDefault();
        restartGame();
    }, { passive: false });

    // ───── Стартовая отрисовка ─────
    updateBasket();
    updateLives();

    // Обновление сложности в игровом цикле
    const originalGameLoop = gameLoop;
    gameLoop = function(now) {
        updateDifficulty();
        originalGameLoop(now);
    };




</script>

</body>
</html>
