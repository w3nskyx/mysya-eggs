      if(kind==='cat'){if(wave%3===0){r.catX=x;this.warn('yarn',x,.85);}else{this.spawn(type,x);if(wave%3===2)this.warn('cone',x<.5?Math.min(.89,x+.38):Math.max(.11,x-.38),.7);}r.spawnIn=1.15;return;}
      if(kind==='rain'||(kind==='finale'&&r.finalPhase===2)){const lane=wave%3,positions=[.18,.50,.82];for(let i=0;i<3;i++)if(i!==lane)this.warn('cone',positions[i],.9);this.spawn(type,positions[lane],{speed:.24});this.spawn('egg',positions[lane],{y:-.18,speed:.24});r.spawnIn=1.75;return;}
      if(kind==='lantern'&&wave%5===0){this.spawn('lantern',x);r.spawnIn=.9;return;}
      const portal=kind==='portal'||(kind==='finale'&&r.finalPhase===1);if(portal&&wave%2===0){this.spawn(type,x,{portal:true});}else{this.spawn(type,r.stage===0&&wave<3?.5:x);}
      if(r.stage>0&&wave%5===3){const hazardX=x<.5?clamp(x+.36,.12,.88):clamp(x-.36,.12,.88);this.warn('cone',hazardX);if(!r.safetyHint){this.emit('hint','Шишки пропускай мимо. Светлая дорожка предупреждает о броске.');r.safetyHint=true;}}
      if(r.route==='rich'&&wave%6===4)this.warn('cone',x<.5?.86:.14,.9);
      if(wave%13===12&&r.hp<r.maxHp)this.spawn('heart',clamp(x+.12,.1,.9),{y:-.16});
      r.spawnIn=(r.stage===0?1.02:.88)*(r.mode==='night'?.91:1);}
    step(dt){this.clock+=dt;this.shake=Math.max(0,this.shake-dt);for(const p of this.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.26*dt;}this.particles=this.particles.filter(p=>p.life>0);for(const t of this.texts){t.life-=dt;t.y-=.045*dt;}this.texts=this.texts.filter(t=>t.life>0);this.trail=this.trail.filter(t=>{t.life-=dt;return t.life>0;});const r=this.r;if(!r||r.phase!=='playing')return;
      r.elapsed+=dt;r.pulse=Math.max(0,r.pulse-dt*5);for(const k of ['cooldown','slow','catCd','invincible','light'])r[k]=Math.max(0,r[k]-dt);
      const dir=(this.keys.ArrowRight||this.keys.d?1:0)-(this.keys.ArrowLeft||this.keys.a?1:0);if(dir)r.targetX=this.limit(r.targetX+dir*dt*.95);
      const oldX=r.x;r.x=this.limit(r.x+(r.targetX-r.x)*(1-Math.exp(-25*dt)));
      if(this.level('comet')&&Math.abs(r.x-oldX)/dt>.45&&this.trail.length<25)this.trail.push({x:r.x,life:.65});
      const timeScale=r.slow>0?.35:1;r.spawnIn-=dt*timeScale;
      for(let i=r.warnings.length-1;i>=0;i--){r.warnings[i].time-=dt*timeScale;if(r.warnings[i].time<=0){const w=r.warnings.splice(i,1)[0];this.spawn(w.type,w.x,{speed:w.speed,portal:w.portal});}}
      if(r.spawnIn<=0)this.wave();
      if(r.kind==='finale'&&r.phaseCaught>=6&&!r.sparkPending){r.sparkPending=true;this.warn('spark',r.x,.6);this.emit('hint','Огонёк появился! Поймай большую звезду.');}
      for(let i=r.items.length-1;i>=0&&r.phase==='playing';i--){const it=r.items[i];if(!it)continue;it.y+=it.speed*dt*timeScale;
        if(r.kind==='wind'||(r.kind==='finale'&&r.finalPhase===0)){it.x=clamp(it.x+Math.sin(r.elapsed*.65)*dt*.055*timeScale,.07,.93);}
        if(it.portal&&!it.warped&&it.y>=.46){it.x=1-it.x;it.warped=true;this.burst(it.x,it.y,'#c6ddf2',8);}
        if(it.type!=='cone'&&((this.level('magnet')&&it.y>.6&&Math.abs(it.x-r.x)<.14+this.level('magnet')*.05)||it.orbit>0)){it.x+=(r.x-it.x)*Math.min(1,dt*(it.orbit>0?7:2.5+this.level('magnet')));if(it.orbit>0)it.orbit=Math.max(0,it.orbit-dt);}
        const direct=Math.abs(it.x-r.x)<this.width()/2+.017,mirror=this.level('echo')&&it.type!=='cone'&&Math.abs(it.x-(1-r.x))<this.width()*(this.level('echo')===2||this.has('patrol')?.62:.44)+.01,tail=it.type!=='cone'&&this.trail.some(t=>Math.abs(t.x-it.x)<.09);
        if(it.y>=CATCH){r.items.splice(i,1);if(direct||mirror||tail)this.catch(it);else this.miss(it);}
      }
      if(r.phase!=='playing')return;
      if(r.kind==='bonus'&&r.elapsed>=D.stages[r.stage].goal)this.complete();
      if(r.stage===0&&r.elapsed>8&&!r.abilityUsed&&r.elapsed<8+dt*2)this.emit('hint','Кнопка «Тише, мир» замедляет падение. Попробуй!');
      this.saveClock+=dt;if(this.saveClock>=1.5){this.saveClock=0;this.checkpoint();}
    }
    burst(x,y,color,n=8){if(!S.data.settings.motion)n=Math.min(4,n);for(let i=0;i<n&&this.particles.length<110;i++)this.particles.push({x,y,vx:(Math.random()-.5)*.32,vy:-.06-Math.random()*.20,life:.35+Math.random()*.4,color,size:1.5+Math.random()*2.7});}
    float(x,y,text,color){if(this.texts.length>=10)this.texts.shift();this.texts.push({x,y:y-.04,text,color,life:1});}
    resize(){const rect=this.canvas.getBoundingClientRect();if(rect.width<1||rect.height<1)return;this.w=rect.width;this.h=rect.height;const dpr=Math.min(window.devicePixelRatio||1,2);this.canvas.width=Math.round(this.w*dpr);this.canvas.height=Math.round(this.h*dpr);this.ctx.setTransform(dpr,0,0,dpr,0,0);this.bgKey='';}
    py(y){return 8+y*(this.h-55);}
    draw(){if(!this.r)return;const c=this.ctx,w=this.w,h=this.h,r=this.r,key=`${w}-${h}-${r.stage}`;if(key!==this.bgKey){this.bg=document.createElement('canvas');this.bg.width=Math.round(w*2);this.bg.height=Math.round(h*2);const bc=this.bg.getContext('2d');bc.scale(2,2);A.background(bc,w,h,r.stage);this.bgKey=key;}
      c.save();if(this.shake>0&&S.data.settings.motion)c.translate(Math.sin(this.clock*70)*this.shake*12,0);c.drawImage(this.bg,0,0,w,h);
      if(r.kind==='wind'||(r.kind==='finale'&&r.finalPhase===0)){c.save();c.globalAlpha=.25;c.strokeStyle='#fff8d6';c.lineWidth=1.3;for(let i=0;i<7;i++){const dir=Math.sin(r.elapsed*.65),x=((this.clock*dir*28+i*71)%(w+70)+w+70)%(w+70)-35,y=90+(i*43)%(Math.max(30,h-150));c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+14,y-8,x+32,y-3);c.stroke();}c.restore();c.fillStyle='#ffffdd';c.textAlign='right';c.font='18px system-ui';c.fillText(Math.sin(r.elapsed*.65)>0?'→':'←',w-25,29);}
      if(r.kind==='cat'){A.cat(c,(r.catX||.5)*w,31,.72,this.clock);}else if(r.kind==='finale'){A.cat(c,w*.87,26,.57,this.clock);for(let i=0;i<3;i++){A.ellipse(c,w*.5+(i-1)*29,29,10,10,i<r.progress?'#edcf89':'#fff6d42a');A.star(c,w*.5+(i-1)*29,29,6,i<r.progress?'#fff3c1':'#c1cbb166');}}
      if(r.kind==='portal'||(r.kind==='finale'&&r.finalPhase===1)){for(const x of [.24,.76]){c.strokeStyle='#cee2dbb0';c.lineWidth=3;c.beginPath();c.ellipse(x*w,this.py(.46),24,11,0,0,Math.PI*2);c.stroke();c.strokeStyle='#a8c3d24a';c.beginPath();c.ellipse(x*w,this.py(.46),31,15,0,0,Math.PI*2);c.stroke();}}
      for(const warn of r.warnings){const x=warn.x*w;c.fillStyle=warn.type==='cone'?'#9c6b5830':'#fff5ba24';c.fillRect(x-w*.062,48,w*.124,Math.max(0,this.py(CATCH)-48));c.fillStyle=warn.type==='cone'?'#b98665':'#e5c781';c.beginPath();c.moveTo(x-5,62);c.lineTo(x+5,62);c.lineTo(x,70);c.fill();A.item(c,{type:warn.type,phase:0},x,45,16,this.clock);}
      for(const it of r.items){if(it.portal&&!it.warped){c.save();c.strokeStyle='#e6f1dfa0';c.lineWidth=1;c.setLineDash([3,7]);c.beginPath();c.moveTo(it.x*w,this.py(it.y));c.lineTo((1-it.x)*w,this.py(.53));c.stroke();A.ellipse(c,(1-it.x)*w,this.py(.53),6,4,'#f0efd480');c.restore();}A.item(c,it,it.x*w,this.py(it.y),clamp(w*.054,18,24),this.clock);}
      if(r.kind==='lantern'&&r.light<=0){const cx=r.x*w,cy=this.py(CATCH),gr=c.createRadialGradient(cx,cy,55,cx,cy,Math.max(w,h)*.85);gr.addColorStop(0,'#172f4800');gr.addColorStop(.35,'#172f4822');gr.addColorStop(1,'#172f48ba');c.fillStyle=gr;c.fillRect(0,0,w,h);}
      if(this.level('magnet')){c.save();c.strokeStyle='#fff4bf36';c.lineWidth=1;c.setLineDash([3,6]);c.beginPath();c.ellipse(r.x*w,this.py(CATCH),w*(.14+this.level('magnet')*.05),38,0,Math.PI,Math.PI*2);c.stroke();c.restore();}
      for(const t of this.trail){c.globalAlpha=t.life*.45;A.star(c,t.x*w,this.py(CATCH)+10,8,'#f6d994');}c.globalAlpha=1;
      if(this.level('echo'))A.basket(c,(1-r.x)*w,this.py(CATCH),this.width()*w*(this.level('echo')===2||this.has('patrol')?1.24:.88),'#adb6d1',r.pulse,true);
      if(r.shield){c.strokeStyle='#c8e7daa8';c.lineWidth=1.8;c.beginPath();c.ellipse(r.x*w,this.py(CATCH)+7,this.width()*w*.66,37,0,0,Math.PI*2);c.stroke();}
      c.globalAlpha=r.invincible>0?(.6+.4*Math.abs(Math.sin(this.clock*13))):1;A.basket(c,r.x*w,this.py(CATCH),this.width()*w,D.starters.find(s=>s.id===r.basket)?.color,r.pulse);c.globalAlpha=1;
      if(r.slow>0){c.fillStyle='#c7e9eb16';c.fillRect(0,0,w,h);}
      for(const p of this.particles){c.globalAlpha=Math.min(1,p.life*2);A.star(c,p.x*w,this.py(p.y),p.size,p.color);}c.globalAlpha=1;
      c.textAlign='center';for(const f of this.texts){c.globalAlpha=Math.min(1,f.life*2);c.font=`700 ${f.text.includes('подряд')?26:15}px system-ui`;c.lineWidth=3;c.strokeStyle='#31554355';c.strokeText(f.text,clamp(f.x*w,40,w-40),this.py(f.y));c.fillStyle=f.color;c.fillText(f.text,clamp(f.x*w,40,w-40),this.py(f.y));}c.globalAlpha=1;c.restore();
    }
  }
  MN.Engine=Engine;
})();

  <script>
'use strict';
(() => {
  const $=id=>document.getElementById(id),D=MN.D,S=MN.Store,A=MN.Art,I=A.icon;
  const button=(label,action,cls='primary',attrs='')=>`<button class="${cls}" data-action="${action}" ${attrs}>${label}</button>`;
  const head=(title,back='home')=>`<div class="page-head">${button(I('back'),back,'icon-button','aria-label="Назад"')}<h2>${title}</h2></div>`;
  const balance=()=>`<div class="balance"><span class="coin">${I('feather')}${S.data.feathers}</span><span class="coin">${I('star')}${S.data.stars}</span></div>`;
  let audio=null,lastSound=0,toastTime=0,hintTime=0,countdown=0,lastFrame=0,uiClock=0,page='home',returnTo='home',imported=null,gesture=null,telegram=null;
  let selectedBasket=S.data.basket,selectedMode=S.data.mode;
  function sound(kind){if(!S.data.settings.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});const now=audio.currentTime;if(kind==='catch'&&now-lastSound<.06)return;lastSound=now;const notes={catch:[520],gold:[740,988],click:[440],power:[350,440,520],damage:[140,110],heal:[660,880],win:[523,659,784,1046],complete:[587,740,880],shield:[900,1200],spark:[659,880,1175],synergy:[523,659,784,1046,1318],light:[800,1000]}[kind]||[550];notes.forEach((hz,i)=>{const osc=audio.createOscillator(),gain=audio.createGain(),t=now+i*.085;osc.type=kind==='damage'?'triangle':'sine';osc.frequency.setValueAtTime(hz,t);if(kind==='gold')osc.frequency.exponentialRampToValueAtTime(hz*.94,t+.27);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(kind==='damage'?.028:.045,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+.24);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.27);osc.onended=()=>{osc.disconnect();gain.disconnect();};});}catch{}}
  function haptic(kind='light'){if(!S.data.settings.haptics)return;try{if(kind==='success')telegram?.HapticFeedback?.notificationOccurred('success');else telegram?.HapticFeedback?.impactOccurred(kind);}catch{}}
  function toast(text,duration=3.6){$('toast').textContent=text;$('toast').classList.add('visible');toastTime=duration;}
  function hint(text){$('field-message').textContent=text;$('field-message').classList.add('visible');hintTime=3.7;}
  function show(html,name='menu',overlay=false){page=name;$('screen').hidden=false;$('screen').className='screen'+(overlay?' overlay':'')+(name==='home'?' home-screen':'');$('screen').innerHTML=`<div class="page">${html}</div>`;$('screen').scrollTop=0;$('game').hidden=!overlay;$('app').classList.remove('playing');document.body.classList.toggle('reduce-motion',!S.data.settings.motion);if(name!=='home'){requestAnimationFrame(()=>{$('screen').querySelector('h2')?.setAttribute('tabindex','-1');});}syncBackButton();}
  const E=new MN.Engine($('world'),event);
  MN.game=E;
  function home(){countdown=0;page='home';const m=S.data,continueText=m.saved?`Продолжить · тропинка ${m.saved.stage+1}`:'В сад за чудесами';const next=D.garden.find(g=>!m.garden.includes(g.id));let quote=m.garden.length===6?'Муся, это теперь самый уютный сад на свете. Я проверил.':m.stats.wins?'Гнездо светится! Но я видел ещё одну тропинку…':'Я совсем чуть-чуть рассыпал волшебство. Поможешь собрать?';
    show(`<div class="home-top">${balance()}${button(I('settings'),'settings','icon-button','aria-label="Настройки"')}</div><div class="home-title"><span class="eyebrow">Сад маленьких чудес</span><h1>Муся и<br>золотое гнездо</h1><p>Поймай волшебство. Верни в сад уют.</p></div><div class="home-art">${A.scene(m.garden)}</div><div class="home-panel"><div class="quote"><span class="avatar">${A.avatar()}</span><span><b>Жулик · хранитель беспорядка</b>${quote}</span></div>${button(continueText+' '+I('arrow'),m.saved?'continue':'loadout')}<div class="home-info">${m.saved?'Приключение сохранено. Яйца ждут тебя.':'8 тропинок · свой набор чудес · маленькая история'}</div>${S.notice?`<div class="save-notice">${S.notice}</div>`:''}</div><nav class="home-nav" aria-label="Главное меню">${button(I('flower')+`<span>Наш сад${next&&m.stars>=next.cost?' · новое!':''}</span>`,'garden','nav-button')}${button(I('tools')+'<span>Мастерская</span>','shop','nav-button')}${button(I('book')+'<span>Альбом</span>','collection','nav-button')}</nav><p class="signature">Для Муси. С любовью, Матусевич.</p>`,'home');S.notice='';}
  function loadout(){selectedBasket=S.data.basket;selectedMode=S.data.mode;loadoutView();}
  function loadoutView(){const m=S.data;const start=D.starters.find(s=>s.id===selectedBasket);show(`${head('Соберёмся в путь')}<span class="eyebrow">Каждый раз — немного другая история</span><h2>С какой корзинкой<br>отправимся?</h2><p>Первое чудо уже лежит внутри. Остальные найдёшь по дороге.</p><div class="card-grid">${D.starters.map(s=>`<button class="starter ${s.id===selectedBasket?'selected':''}" data-action="starter" data-id="${s.id}" ${m.garden.length<s.unlock?'disabled':''}>${I(m.garden.length<s.unlock?'lock':s.icon)}<b>${s.name}</b><small>${m.garden.length<s.unlock?`Обустроить ${s.unlock} уголка`:'Готова к пути'}</small></button>`).join('')}</div><div class="note">${I(start.icon)} ${start.text}.<br>${D.perk(start.perk).desc[0]}</div><div class="mode-switch"><button data-action="mode" data-id="normal" class="${selectedMode==='normal'?'selected':''}">Уютное приключение</button><button data-action="mode" data-id="night" ${!m.stats.wins?'disabled':''} class="${selectedMode==='night'?'selected':''}">${!m.stats.wins?I('lock'):''} Ночная тропа</button></div><p class="tiny">${selectedMode==='night'?'Знакомый сад после заката: плотнее волны, чуть быстрее падение. Все чудеса работают.':m.stats.wins?'Ночная тропа открыта. В обычном режиме всегда можно гулять без спешки.':'Ночная тропа откроется после первой победы.'}</p>${button('Начать приключение '+I('arrow'),'new-run')}${m.saved?'<p class="tiny center">Предыдущий забег заменится только после нажатия «Начать приключение». Пёрышки и сад останутся.</p>':''}`,'loadout');}
  function routeMap(){return `<div class="route-map" aria-label="Тропинка ${E.r.stage+1} из 8">${D.stages.map((s,i)=>`<span class="route-node ${i<E.r.stage?'done':i===E.r.stage?'current':''}" title="${s.name}">${i<E.r.stage?I('check'):i===E.r.stage?I(s.icon):i+1}</span>`).join('')}</div>`;}
  function build(){return `<div class="build-tags">${Object.entries(E.r.perks).map(([id,n])=>`<span class="build-tag">${I(D.perk(id).icon)} ${D.perk(id).name}${n>1?' II':''}</span>`).join('')}</div>`;}
  function intro(){const r=E.r,s=D.stages[r.stage];show(`<div class="topline"><span class="eyebrow">${s.region} · ${r.stage+1} / 8</span><span class="tiny">${I('heart')} ${r.hp}/${r.maxHp}</span></div>${routeMap()}<div class="stage-poster">${A.scene(S.data.garden,r.stage,true)}<span class="stage-chip">${I(s.icon)} ${s.kind==='cat'?'Испытание кота':s.kind==='bonus'?'Бонусная поляна':s.kind==='finale'?'Финал приключения':'Новая тропинка'}</span></div><h2>${s.name}</h2><p>${s.text}</p><div class="note">${s.tip}</div><div class="speaker"><b>${s.speaker}</b><p>«${s.quote}»</p></div>${r.syn.length?`<div class="tiny">Синергии: ${D.activeSynergies(r.perks).map(s=>s.name).join(' · ')}</div>`:''}${button((r.stage===0?'Начать игру':'На тропинку')+' '+I('arrow'),'play')}${button('Сохранить и в сад','home','text-button')}`,'intro');}
  function begin(){if(!E.r)return;E.r.phase='paused';E.checkpoint();page='playing';$('screen').hidden=true;$('game').hidden=false;$('app').classList.add('playing');$('countdown').hidden=false;$('countdown').textContent='Готова?';countdown=1.3;gesture=null;E.keys={};E.resize();updateHUD();syncBackButton();}
  function pauseGame(){if(countdown>0){countdown=0;$('countdown').hidden=true;E.r.phase='paused';E.checkpoint();pauseView();}else E.pause();releasePointer();}
  function pauseView(){show(`<div class="story-seal">${I('moon')}</div><span class="eyebrow">Яйца подождут</span><h2>Минутка для себя</h2><p>Муся важнее. Всё волшебство останется на своих местах.</p><div class="note">${D.stages[E.r.stage].name} · тропинка ${E.r.stage+1}/8<br>${E.r.score} очков · ${E.r.earned} пёрышек</div>${build()}${E.r.syn.map(id=>{const s=D.synergies.find(s=>s.id===id);return `<div class="note"><b>${s.name}</b><br>${s.desc}</div>`;}).join('')}${button('Продолжить '+I('play'),'resume')}${button('Настройки управления','settings-pause','secondary')}<div class="row">${button('Сохранить и в сад','home','text-button')}${button('Завершить прогулку','abandon','text-button')}</div>`,'paused',true);}
  function choice(){const r=E.r;show(`<div class="topline"><span class="eyebrow">Тропинка ${r.stage+1} пройдена</span><span class="coin">${I('star')} +1 ${I('feather')} +${r.stageReward||0}</span></div><h2>Карманное<br>волшебство</h2><p>Выбери одно чудо. Оно останется с тобой до конца приключения.</p><div class="perk-list">${r.offers.map(id=>{const p=D.perk(id),n=r.perks[id]||0;const pair=D.synergies.find(s=>s.needs[id]&&Object.entries(s.needs).every(([key,num])=>(r.perks[key]||0)+(key===id?1:0)>=num)&&!r.syn.includes(s.id));return `<button class="perk-card ${p.rarity}" data-action="perk" data-id="${id}"><span class="perk-art">${I(p.icon)}</span><span><span class="rarity">${p.rarity==='epic'?'Эпическое':p.rarity==='rare'?'Редкое':'Доброе чудо'} · ${n+1}/${p.max}</span><h3>${p.name}</h3><p>${p.desc[n]}</p>${pair?`<div class="synergy-hint">Откроется: ${pair.name}</div>`:''}</span></button>`;}).join('')}</div><div class="choice-footer">${button(I('reroll')+` Заменить (${r.rerolls})`,'reroll','text-button',r.rerolls?'':'disabled')}<span class="tiny">${I('heart')} ${r.hp}/${r.maxHp}</span></div>${button(I('tea')+' Отдохнуть: все сердца + 12 пёрышек','tea','secondary')}<p class="tiny center">Отдых заменяет выбор чуда на этой тропинке.</p>`,'choice');}
  function route(){show(`<span class="eyebrow">Маленькая развилка</span><h2>Куда поведёт<br>любопытство?</h2><p>Обе дорожки ведут к ${E.r.stage===2?'Жулику':'гнезду'}. Условия действуют только на следующей тропинке.</p><div class="stage-poster">${A.scene(S.data.garden,E.r.stage,true)}</div><div class="perk-list"><button class="perk-card" data-action="route" data-id="calm"><span class="perk-art">${I('tea')}</span><span><span class="rarity">Тихая дорожка</span><h3>Чашечка спокойствия</h3><p>Восстанови сердце. На следующей тропинке всё падает на 10% медленнее.</p></span></button><button class="perk-card rare" data-action="route" data-id="rich"><span class="perk-art">${I('gold')}</span><span><span class="rarity">Любопытная дорожка</span><h3>За золотым шелестом</h3><p>Больше золота и пёрышек. На обычных волнах появляется дополнительная шишка.</p></span></button></div><div class="speaker"><b>Жулик</b><p>«Слева красиво. Справа блестит. Очень сложный выбор.»</p></div>`,'route');}
  function end(win){const r=E.r;show(`<div class="result-icon">${I(win?'nest':'moon')}</div><div class="center"><span class="eyebrow">${win?'Сад снова светится':'Каждый шаг — часть истории'}</span><h2>${win?'Муся, ты — чудо.':'Обнимемся<br>и попробуем ещё?'}</h2><p>${win?'Три огонька зажглись. Жулик свернулся у гнезда, а сад запомнил твою улыбку.':'Жулик собрал все пёрышки. Ничего не пропало — можно украсить сад и придумать новый набор чудес.'}</p></div><div class="stats-grid"><div><strong>${r.score}</strong><small>очков</small></div><div><strong>+${r.earned}</strong><small>пёрышек</small></div><div><strong>+${r.stars}</strong><small>звёзд для сада</small></div></div><div class="journey-summary"><span>Комбо ${r.bestCombo}</span><span>Тропинка ${r.stage+1}/8</span><span>${r.caught} уловов</span></div>${r.syn.length?`<div class="note">Твой набор: ${D.activeSynergies(r.perks).map(s=>s.name).join(' + ')}</div>`:''}${win?'<p class="end-note center">«Мой любимый дом — там, где ты».<br><small>Матусевич</small></p>':''}${button(I('flower')+' Обустроить наш сад','garden')}${button('Ещё одно приключение '+I('arrow'),'loadout','secondary')}${button('На главную','home','text-button')}`,'end');}
  function garden(){const m=S.data,next=D.garden.find(g=>!m.garden.includes(g.id));show(`${head('Наш маленький сад')}<div class="topline"><span class="eyebrow">${m.garden.length}/6 уголков наполнены уютом</span>${balance()}</div><div class="garden-art">${A.scene(m.garden)}</div><div class="garden-progress">${D.garden.map(g=>`<i class="${m.garden.includes(g.id)?'done':''}"></i>`).join('')}</div>${next?`<div class="garden-project"><span class="tag">Следующее маленькое чудо</span><h3>${I(next.icon)} ${next.name}</h3><p>${next.text}</p>${button(`Добавить в сад · ${next.cost} ${I('star')}`,'build-garden','primary',m.stars>=next.cost?'':'disabled')}${m.stars<next.cost?`<p class="tiny center">Ещё ${next.cost-m.stars} ${next.cost-m.stars===1?'звезда':'звезды'}. За каждую тропинку — одна.</p>`:''}</div>`:'<div class="garden-project center"><h3>Здесь живёт любовь</h3><p>Все шесть уголков готовы. Сад целиком ваш — Мусин, Матусевича и, конечно, Жулика.</p></div>'}<p class="tiny">Каждая постройка меняет рисунок сада. Цветы открывают Лунную корзину, фонарики — Медовую.</p>${m.garden.length?`<div class="build-tags">${D.garden.filter(g=>m.garden.includes(g.id)).map(g=>`<span class="build-tag">${I(g.icon)} ${g.name}</span>`).join('')}</div>`:''}${button(m.saved?'Продолжить приключение':'За новыми звёздами',m.saved?'continue':'loadout','secondary')}`,'garden');}
  function buildGarden(){const m=S.data,g=D.garden.find(g=>!m.garden.includes(g.id));if(!g||m.stars<g.cost)return;m.stars-=g.cost;m.garden.push(g.id);if(m.garden.length===6&&!m.collection.includes('garden'))m.collection.push('garden');S.save();garden();toast(g.reply,5);sound('complete');haptic('success');}
  function shop(){const m=S.data;show(`${head('Мастерская Муси')}<div class="topline"><span class="eyebrow">Удобства для новых приключений</span>${balance()}</div><p>Всё купленное остаётся. Эти улучшения действуют со следующего забега.</p>${D.upgrades.map(u=>{const n=m.upgrades[u.id],max=n>=u.max;return `<div class="upgrade-card">${I(u.icon)}<div><h3>${u.name}</h3><p>${u.text}<br>Уровень ${n}/${u.max}</p></div><button class="buy-button" data-action="buy" data-id="${u.id}" ${max||m.feathers<u.costs[n]?'disabled':''}>${max?I('check'):u.costs[n]+' '+I('feather')}</button></div>`;}).join('')}<div class="subhead"><h3>Стартовые корзинки</h3></div><div class="card-grid">${D.starters.map(s=>`<div class="starter ${m.garden.length>=s.unlock?'selected':''}">${I(m.garden.length>=s.unlock?s.icon:'lock')}<b>${s.name}</b><small>${m.garden.length>=s.unlock?s.text:`Обустроить ${s.unlock} уголка сада`}</small></div>`).join('')}</div><div class="note">Корзину выбираешь перед началом приключения. Лунная и Медовая открываются за обустройство сада.</div>${button('Выбрать корзинку','loadout','secondary')}`,'shop');}
  function buy(id){const m=S.data,u=D.upgrades.find(v=>v.id===id);if(!u)return;const n=m.upgrades[id];if(n>=u.max||m.feathers<u.costs[n])return;m.feathers-=u.costs[n];m.upgrades[id]++;S.save();shop();sound('complete');toast('Готово! Улучшение поможет в следующем приключении.');}
  function collection(){const m=S.data;show(`${head('Альбом чудес')}<div class="topline"><span class="eyebrow">У каждой находки есть история</span><span class="tiny">${m.collection.length}/${D.relics.length}</span></div><div class="collection-grid">${D.relics.map(r=>`<div class="relic ${m.collection.includes(r.id)?'':'locked'}">${I(m.collection.includes(r.id)?r.icon:'lock')}<b>${r.name}</b><p>${r.hint}</p></div>`).join('')}</div><div class="stats-grid"><div><strong>${m.stats.wins}</strong><small>побед</small></div><div><strong>${m.stats.caught}</strong><small>уловов</small></div><div><strong>${m.stats.bestCombo}</strong><small>лучшее комбо</small></div></div><p class="tiny center">${m.stats.runs} приключений · рекорд ${m.stats.best} · ночных побед ${m.stats.nightWins}</p><div class="subhead"><h3>Рецепты волшебства</h3></div>${D.synergies.map(s=>`<div class="section-card"><h3>${I(s.icon)} ${s.name}</h3><p class="tiny">${Object.entries(s.needs).map(([id,n])=>D.perk(id).name+(n>1?' II':'')).join(' + ')}</p><p style="font-size:12px;margin-bottom:0">${s.desc}</p></div>`).join('')}`,'collection');}
  function settings(){const m=S.data;show(`${head('Настроим уют',returnTo)}<div class="setting"><div><b>Звуки волшебства</b><small>Мягкие звуки ловли, наград и способностей</small></div>${button(m.settings.sound?'Вкл.':'Выкл.','sound','toggle '+(m.settings.sound?'on':''))}</div><div class="setting"><div><b>Виброотклик</b><small>При поддержке Telegram</small></div>${button(m.settings.haptics?'Вкл.':'Выкл.','haptics','toggle '+(m.settings.haptics?'on':''))}</div><div class="setting"><div><b>Живые эффекты</b><small>Частицы, переходы и лёгкая встряска</small></div>${button(m.settings.motion?'Вкл.':'Выкл.','motion','toggle '+(m.settings.motion?'on':''))}</div><div class="setting"><div><b>Управление пальцем</b><small>${m.settings.control==='relative'?'Относительное: касание не двигает корзину':'Прямое: место касания задаёт положение'}</small></div>${button(m.settings.control==='relative'?'Плавное':'Прямое','control','toggle')}</div><div class="setting"><label for="sensitivity"><b>Чувствительность</b><small id="sensitivity-value">${m.settings.sensitivity.toFixed(2)}×</small></label><input id="sensitivity" type="range" min="1" max="2.5" step=".05" value="${m.settings.sensitivity}" aria-label="Чувствительность управления"></div><div class="note">Палец движется только по отдельной дорожке. Корзина остаётся над ней. Можно отпустить палец и поставить его в любое удобное место.</div>${button('Как играть','help','secondary')}<div class="subhead"><h3>Твоя история</h3></div><p class="tiny">Прогресс хранится в этом браузере. Скачанная копия поможет перенести сад на другое устройство.</p><div class="row">${button(I('download')+' Скачать копию','export','secondary')}${button(I('upload')+' Загрузить','import','secondary')}</div>${m.saved?button('Начать другое приключение','loadout','text-button'):''}<p class="tiny center">Муся и золотое гнездо · ${D.version}<br>Без рекламы, покупок и спешки.</p>`,'settings');}
  function help(){show(`${head('Ловим маленькие чудеса','settings')}<div class="help-row">${I('basket')}<div><h3>Палец — на нижней дорожке</h3><p>Води влево и вправо. Корзина движется выше, и палец её не закрывает. Отпускаешь палец — корзина останавливается.</p></div></div><div class="help-row">${I('egg')}<div><h3>Яйца ловим, шишки пропускаем</h3><p>Обычный улов сбрасывает счётчик пропусков. Три пропуска подряд отнимают сердце. Пойманная шишка тоже отнимает сердце; сначала расходуется щит.</p></div></div><div class="help-row">${I('snow')}<div><h3>Когда всё закрутилось — «Тише, мир»</h3><p>Кнопка над дорожкой замедляет падение. Можно нажать другим пальцем, продолжая управлять корзиной.</p></div></div><div class="help-row">${I('spark')}<div><h3>Одно из трёх чудес после тропинки</h3><p>Улучшай знакомые силы или пробуй новые. Их сочетания открывают синергии. Рецепты есть в альбоме.</p></div></div><div class="help-row">${I('star')}<div><h3>Звёзды для сада, пёрышки для мастерской</h3><p>Награды остаются даже после неудачи. Обустраивай сад, чтобы открыть новые стартовые корзины.</p></div></div><div class="note"><b>На компьютере:</b> мышь над полем или нижней дорожкой; <span class="key">← →</span> / <span class="key">A D</span> — движение, <span class="key">Пробел</span> — способность, <span class="key">Esc</span> — пауза.</div>${button('Всё понятно','settings')}`,'help');}
  function abandon(){show(`<span class="eyebrow">Можно вернуться позже</span><h2>Закончим эту<br>прогулку?</h2><p>Собранные пёрышки и звёзды останутся. Набор чудес начнётся заново.</p>${button('Сохранить и вернуться в сад','home')}${button('Завершить забег','confirm-abandon','secondary')}${button('Продолжить игру','resume','text-button')}`,'abandon',true);}
  function updateHUD(){const r=E.r;if(!r)return;const s=D.stages[r.stage];$('location').textContent=`${s.region} · ${r.stage+1}/8`;$('stage-name').textContent=s.name;
    const hearts=Array.from({length:r.maxHp},(_,i)=>I('heart',i>=r.hp?'empty':'')).join('')+(r.shield?`<span class="shield-count">${I('bubble')}${r.shield}</span>`:'');if($('hearts').innerHTML!==hearts)$('hearts').innerHTML=hearts;$('hearts').setAttribute('aria-label',`Здоровье ${r.hp} из ${r.maxHp}, щитов ${r.shield}`);
    $('score').textContent=r.score+' очков';$('combo').textContent=r.combo>=2?`${r.combo} · ×${Math.min(5,1+Math.floor(r.combo/6))}`:'';
    let ratio=r.progress/s.goal,goal=`Улов ${r.progress}/${s.goal}`;if(r.kind==='cat')goal=`Клубки ${r.progress}/5`;if(r.kind==='bonus'){goal=`Пикник · ещё ${Math.max(0,Math.ceil(s.goal-r.elapsed))} с`;ratio=r.elapsed/s.goal;}if(r.kind==='finale'){goal=`Огоньки ${r.progress}/3 · ${Math.min(6,r.phaseCaught)}/6 яиц`;ratio=(r.progress+Math.min(1,r.phaseCaught/6))/3;}
    $('goal').textContent=goal;$('progress').style.width=Math.min(100,ratio*100)+'%';$('misses').textContent=r.kind==='bonus'?'Без потери сердец':r.missStreak?'Пропуски '+r.missStreak+'/3':r.guard?'Комбо защищено':'';
    $('power').disabled=r.cooldown>0||r.phase!=='playing';$('power-label').textContent=r.slow>0?`Ещё ${Math.ceil(r.slow)} с тишины`:r.cooldown>0?`Через ${Math.ceil(r.cooldown)} с`:'Замедлить время';$('power-fill').style.width=r.cooldown>0?(r.cooldown/(E.level('freeze')>=2?11:17)*100)+'%':'0';
    const tags=Object.keys(r.perks).slice(-5).map(id=>I(D.perk(id).icon,r.syn.some(s=>D.synergies.find(v=>v.id===s)?.needs[id])?'syn':'')).join('');if($('build-mini').innerHTML!==tags)$('build-mini').innerHTML=tags;$('pad-dot').style.left=(r.x*100)+'%';$('touchpad').setAttribute('aria-valuenow',Math.round(r.x*100));
  }
  function event(type,value){switch(type){case'intro':intro();break;case'playing':page='playing';$('screen').hidden=true;$('app').classList.add('playing');break;case'paused':countdown=0;pauseView();break;case'choice':choice();break;case'route':route();break;case'end':end(value);sound(value?'win':'heal');haptic(value?'success':'light');break;case'complete':sound('complete');haptic('success');break;case'catch':sound(value==='gold'?'gold':'catch');if(value==='gold')haptic('light');break;case'damage':sound('damage');haptic('medium');$('game').classList.remove('damage');requestAnimationFrame(()=>$('game').classList.add('damage'));break;case'hint':hint(value);break;case'unlock':if(value)toast('Новая находка: '+value.name);break;case'synergy':sound('synergy');haptic('success');toast(`Новое сочетание — ${value.name}! ${value.desc}`,6);break;case'combo':sound('gold');haptic('light');break;case'power':sound('power');haptic('light');break;case'spark':sound('spark');haptic('success');break;case'shield':case'heal':case'light':sound(type);break;}}
  function releasePointer(){const previous=gesture;gesture=null;if(previous){try{$('touchpad').releasePointerCapture(previous.id);}catch{}}$('touchpad').classList.remove('active');}
  $('touchpad').addEventListener('pointerdown',e=>{if(E.r?.phase!=='playing'||gesture)return;e.preventDefault();sound('click');gesture={id:e.pointerId,lastX:e.clientX};try{$('touchpad').setPointerCapture(e.pointerId);}catch{}$('touchpad').classList.add('active');if(S.data.settings.control==='absolute'){const rect=$('touchpad').getBoundingClientRect();E.move((e.clientX-rect.left)/rect.width);}});
  $('touchpad').addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId||E.r?.phase!=='playing')return;e.preventDefault();const rect=$('touchpad').getBoundingClientRect();if(S.data.settings.control==='absolute')E.move((e.clientX-rect.left)/rect.width);else E.move(E.r.targetX+(e.clientX-gesture.lastX)/rect.width*S.data.settings.sensitivity);gesture.lastX=e.clientX;});
  for(const name of ['pointerup','pointercancel','lostpointercapture'])$('touchpad').addEventListener(name,e=>{if(gesture?.id===e.pointerId)releasePointer();});
  $('world').addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||E.r?.phase!=='playing')return;const rect=$('world').getBoundingClientRect();E.move((e.clientX-rect.left)/rect.width);});
  $('world').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){const rect=$('world').getBoundingClientRect();E.move((e.clientX-rect.left)/rect.width);}else if(E.r?.phase==='playing')hint('Управляй с нижней дорожки — так всё видно.');});
  $('game').addEventListener('contextmenu',e=>e.preventDefault());$('touchpad').addEventListener('wheel',e=>e.preventDefault(),{passive:false});
  document.addEventListener('keydown',e=>{const typing=['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);if(typing)return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','a','d',' ','Escape'].includes(k)&&!$('game').hidden){if(k!=='Escape')e.preventDefault();if(E.r?.phase==='playing'){E.keys[k]=true;if(k===' '&&!e.repeat)E.activate();if(k==='Escape')pauseGame();}else if(k==='Escape'&&countdown)pauseGame();else if(k==='Escape'&&page==='paused')begin();}});
  document.addEventListener('keyup',e=>{delete E.keys[e.key.length===1?e.key.toLowerCase():e.key];});
  $('pause').innerHTML=I('pause');$('power-icon').innerHTML=I('snow');$('pause').addEventListener('click',pauseGame);$('power').addEventListener('click',()=>E.activate());
  $('screen').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=b.dataset.id;if(!['sound','perk','new-run'].includes(action))sound('click');switch(action){
    case'home':if(E.r?.phase==='playing')E.pause();home();break;case'loadout':loadout();break;
    case'starter':if(D.starters.some(s=>s.id===id&&s.unlock<=S.data.garden.length)){selectedBasket=id;loadoutView();}break;case'mode':if(id==='normal'||(id==='night'&&S.data.stats.wins)){selectedMode=id;loadoutView();}break;
    case'new-run':S.data.basket=selectedBasket;S.data.mode=selectedMode;E.newRun();sound('complete');break;
    case'continue':if(!E.restore()){S.data.saved=null;S.save();home();toast('Забег не удалось восстановить. Сад и пёрышки остались.');}break;
    case'play':case'resume':begin();break;case'paused':pauseView();break;case'perk':if(E.takePerk(id))sound('complete');break;case'tea':E.takeTea();sound('heal');break;case'reroll':if(E.reroll())sound('power');break;case'route':E.chooseRoute(id);break;
    case'garden':garden();break;case'build-garden':buildGarden();break;case'shop':shop();break;case'buy':buy(id);break;case'collection':collection();break;
    case'settings':if(!['settings','help'].includes(page))returnTo='home';settings();break;case'settings-pause':returnTo='paused';settings();break;
    case'sound':case'haptics':case'motion':S.data.settings[action]=!S.data.settings[action];S.save();settings();if(action==='sound')sound('gold');break;
    case'control':S.data.settings.control=S.data.settings.control==='relative'?'absolute':'relative';S.save();settings();break;case'help':help();break;
    case'abandon':abandon();break;case'confirm-abandon':E.finish(false);break;
    case'export':exportSave();break;case'import':$('import-file').click();break;case'confirm-import':if(imported&&S.import(imported)){imported=null;E.r=null;home();toast('Твой сад и приключение восстановлены.');}else toast('Не удалось загрузить копию.');break;
  }});
  $('screen').addEventListener('input',e=>{if(e.target.id==='sensitivity'){S.data.settings.sensitivity=Number(e.target.value);$('sensitivity-value').textContent=S.data.settings.sensitivity.toFixed(2)+'×';}});
  $('screen').addEventListener('change',e=>{if(e.target.id==='sensitivity')S.save();});
  function exportSave(){E.checkpoint();const blob=new Blob([S.export()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='musya-garden-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Копия прогресса готова к скачиванию.');}
  $('import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>2e6){toast('Этот файл слишком большой для сохранения игры.');return;}try{const text=await file.text(),data=S.unpack(text);if(!data){toast('Это не подходящая копия сохранения. Твой прогресс не изменён.');return;}imported=text;show(`${head('Вернуть свой сад','settings')}<h2>Копия найдена</h2><div class="stats-grid"><div><strong>${data.feathers}</strong><small>пёрышек</small></div><div><strong>${data.garden.length}/6</strong><small>уголков сада</small></div><div><strong>${data.stats.wins}</strong><small>побед</small></div></div><p>Этот сад заменит текущий прогресс. Предыдущая версия останется в автоматической резервной копии.</p>${button('Восстановить эту копию','confirm-import')}${button('Оставить текущую игру','settings','secondary')}`,'import');}catch{toast('Файл не удалось прочитать. Текущий сад на месте.');}});
  function backgroundPause(){E.keys={};releasePointer();if(E.r?.phase==='playing'||countdown>0)pauseGame();else E.checkpoint();try{audio?.suspend();}catch{}}
  document.addEventListener('visibilitychange',()=>{if(document.hidden)backgroundPause();lastFrame=performance.now();});window.addEventListener('blur',backgroundPause);window.addEventListener('pagehide',backgroundPause);window.addEventListener('pageshow',()=>{lastFrame=performance.now();});
  function syncBackButton(){try{if(!telegram)return;page==='home'?telegram.BackButton.hide():telegram.BackButton.show();}catch{}}
  function integrate(){telegram=window.Telegram?.WebApp;if(!telegram)return;const safeCall=(f)=>{try{f();}catch{}};safeCall(()=>telegram.ready());safeCall(()=>telegram.expand());safeCall(()=>telegram.disableVerticalSwipes?.());safeCall(()=>telegram.setHeaderColor('#173e37'));safeCall(()=>telegram.setBackgroundColor('#173e37'));safeCall(()=>telegram.setBottomBarColor?.('#173e37'));
    const safeArea=()=>{const a=telegram.safeAreaInset||{},b=telegram.contentSafeAreaInset||{};for(const k of ['top','bottom','left','right'])document.documentElement.style.setProperty('--tg-safe-'+k,((Number(a[k])||0)+(Number(b[k])||0))+'px');E.resize();};safeArea();
    safeCall(()=>telegram.onEvent('safeAreaChanged',safeArea));safeCall(()=>telegram.onEvent('contentSafeAreaChanged',safeArea));safeCall(()=>telegram.onEvent('viewportChanged',()=>{E.resize();}));safeCall(()=>telegram.onEvent('deactivated',backgroundPause));safeCall(()=>telegram.BackButton.onClick(()=>{if(E.r?.phase==='playing'||countdown)pauseGame();else if(page==='settings'&&returnTo==='paused')pauseView();else home();}));syncBackButton();}
  // Optional SDK is fetched only inside a Telegram launch; the local game has no network dependency.
  if(window.Telegram?.WebApp)integrate();else if(/tgWebAppData|tgWebAppVersion|tgWebAppPlatform/.test(location.hash+' '+location.search)){const sdk=document.createElement('script');sdk.src='https://telegram.org/js/telegram-web-app.js';sdk.async=true;sdk.onload=integrate;sdk.onerror=()=>{};document.head.appendChild(sdk);}
  const resize=new ResizeObserver(()=>{E.resize();});resize.observe($('field'));window.addEventListener('orientationchange',()=>{if(E.r?.phase==='playing'||countdown)pauseGame();});window.visualViewport?.addEventListener('resize',()=>E.resize());
  function frame(now){const dt=Math.min(.05,Math.max(0,(now-lastFrame)/1000||0));lastFrame=now;if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').classList.remove('visible');}if(hintTime>0){hintTime-=dt;if(hintTime<=0)$('field-message').classList.remove('visible');}if(!document.hidden&&!$('game').hidden){if(countdown>0){countdown-=dt;$('countdown').textContent=countdown>.65?'Готова?':'Лови!';if(countdown<=0){$('countdown').hidden=true;E.start();}}E.step(dt);E.draw();uiClock+=dt;if(uiClock>.08){uiClock=0;updateHUD();}}requestAnimationFrame(frame);}
  home();requestAnimationFrame(frame);
})();

</script>
